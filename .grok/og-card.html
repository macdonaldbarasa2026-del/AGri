<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LockupSerif";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "LockupSans";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #1A211C;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 46%;
    }
    .wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 62% at 50% 48%, rgba(26, 33, 28, 0.28) 0%, rgba(26, 33, 28, 0.52) 100%),
        linear-gradient(180deg, rgba(26, 33, 28, 0.22) 0%, rgba(26, 33, 28, 0.08) 28%, rgba(26, 33, 28, 0.08) 72%, rgba(26, 33, 28, 0.42) 100%);
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 720px;
      text-align: center;
      color: #F3EFE4;
    }
    .leaf {
      width: 34px;
      height: 42px;
      margin: 0 auto 18px;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(26, 33, 28, 0.45));
    }
    .kenya {
      font-family: LockupSans, "Liberation Sans", sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.62em;
      padding-left: 0.62em;
      line-height: 1;
      color: #F3EFE4;
      text-shadow: 0 2px 14px rgba(26, 33, 28, 0.7);
    }
    .shamb {
      font-family: LockupSerif, "Liberation Serif", serif;
      font-weight: 700;
      font-size: 118px;
      letter-spacing: 0.12em;
      padding-left: 0.12em;
      line-height: 0.92;
      margin-top: 10px;
      color: #F3EFE4;
      text-shadow:
        0 2px 0 rgba(26, 33, 28, 0.35),
        0 8px 28px rgba(26, 33, 28, 0.55);
    }
    .rule {
      width: 72px;
      height: 3px;
      margin: 20px auto 16px;
      background: #3D8B5F;
      border-radius: 2px;
      box-shadow: 0 1px 0 rgba(243, 239, 228, 0.25);
    }
    .tag {
      font-family: LockupSans, "Liberation Sans", sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.46em;
      padding-left: 0.46em;
      color: #cfe4d3;
      text-shadow: 0 2px 10px rgba(26, 33, 28, 0.7);
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="photo" alt="" src="__PHOTO__" />
    <div class="wash"></div>
    <div class="lockup">
      <svg class="leaf" viewBox="0 0 34 42" aria-hidden="true">
        <path fill="#F3EFE4" d="M17 2.4c8.2 5.4 13.4 13.6 11.2 21.4-1.4 4.8-5.8 7.6-10.8 5.8-5 1.8-9.4-1-10.8-5.8C4.4 16 9.2 7.8 17 2.4z"/>
        <path d="M17 7.2c.15 5 .15 10.6 0 20.4" fill="none" stroke="#3D8B5F" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M17 16.2c2.8 1.4 4.6 3.2 5.8 5.2" fill="none" stroke="#3D8B5F" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <div class="kenya">KENYA</div>
      <div class="shamb">SHAMB</div>
      <div class="rule"></div>
      <div class="tag">HIGHLAND HARVEST</div>
    </div>
  </div>
</body>
</html>
